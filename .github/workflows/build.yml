name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev python3-pip patch

      - name: Install Buildozer, Cython and Virtualenv
        run: |
          pip install --upgrade pip
          pip install buildozer cython virtualenv

      - name: Build Android APK
        run: |
          # Використовуємо офіційний вбудований прапорець для автоматичного прийняття ліцензій Google
          # Це змусить Buildozer завантажити чистий та правильний sdkmanager у потрібну папку
          buildozer --accept-sdk-license -v android debug
          
      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-Downloader-APK
          path: bin/*.apk
